<style>
:root{
  --bg:#f2f5fa; --card:#ffffff; --ink:#141a24; --ink2:#3a4457; --muted:#77839a;
  --line:#e3e8f1; --accent:#2f6df6; --accent-ink:#ffffff; --accent-soft:#e9f0ff;
  --ok:#0f9d68; --ok-soft:#e6f7f0; --bad:#d93c43; --bad-soft:#fdeced;
  --mid:#a8750e; --mid-soft:#fbf3e0;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -20px rgba(16,24,40,.3);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1219; --card:#161b24; --ink:#eef2f9; --ink2:#c7cfdd; --muted:#8892a5;
    --line:#242b37; --accent:#5b8cff; --accent-ink:#08101f; --accent-soft:#1a2540;
    --ok:#3ddc9a; --ok-soft:#11301f; --bad:#ff6f74; --bad-soft:#331416;
    --mid:#f0b754; --mid-soft:#33270f;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  line-height:1.55;padding-bottom:48px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:clamp(19px,4.6vw,24px);letter-spacing:-.01em}
h2{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.92em}

.hd{padding:18px 0 10px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:var(--shadow)}
.hd-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);
  padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.tab{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
  padding:9px 4px;border-radius:9px;cursor:pointer;transition:.15s;min-height:38px}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:700}

main{display:block;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.tile b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--muted)}
.tile.hot b{color:var(--bad)}
.tile.new b{color:var(--accent)}

.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:inherit;font-size:15px;font-weight:600;padding:10px 16px;border-radius:11px;cursor:pointer;
  transition:.15s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.big{width:100%;font-size:17px;padding:14px;border-radius:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{font-size:13px;padding:7px 12px;min-height:36px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;
  cursor:pointer;padding:6px 8px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--accent)}
.link.danger:hover{color:var(--bad)}

.prog{height:7px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.q-top{display:flex;align-items:center;gap:12px}
.q-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{text-align:center;padding:18px 4px 6px;min-height:196px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px}
.loud{font-size:46px;line-height:1;filter:drop-shadow(0 2px 6px rgba(47,109,246,.25))}
.zhBig{font-size:clamp(34px,10vw,52px);font-weight:800;letter-spacing:.04em;line-height:1.2;
  word-break:break-word;max-width:100%}
.enBig{font-size:clamp(34px,10vw,54px);font-weight:800;letter-spacing:.02em;line-height:1.15;
  word-break:break-word;max-width:100%}
.subzh{font-size:16px;color:var(--muted);letter-spacing:.04em}
.wcount{font-size:13px;color:var(--muted);letter-spacing:.06em}
.waittip{font-size:13px;color:var(--muted);margin-top:2px}
.timerbar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.timerbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#7ea6ff);border-radius:999px}
.qtag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:2px 10px;margin-bottom:8px}
.alts{font-size:13px;color:var(--muted);margin-top:4px}

/* 自选课次 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.pick{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;
  padding:10px 11px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s;min-height:62px;position:relative}
.pick b{display:block;font-size:13px;line-height:1.3;padding-right:34px}
.pick span{font-size:12px;color:var(--muted)}
.pick:hover{border-color:var(--accent)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick.on b{color:var(--accent)}

const DEFAULT_UNITS = UNITS_DATA.map(function(u){
  return {
    id: u[0],
    name: u[1],
    words: u[2].map(function(p){ return { en: p[0], zh: p[1] }; })
  };
});

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function dateKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function addDays(key, n){
  const p = key.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  d.setDate(d.getDate() + n);
  return dateKey(d);
}

function boxDue(box, from){
  const i = Math.min(Math.max(box | 0, 0), BOX_DAYS.length - 1);
  return addDays(from, BOX_DAYS[i]);
}

function makeKey(unitId, en){
  return unitId + '||' + String(en).trim().toLowerCase();
}

function uid(prefix){
  return (prefix || 'e') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function resolveWord(state, key){
  const p = state.progress[key];
  if (p) return { en: p.en, zh: p.zh || '', alt: p.alt || [], unitId: p.unitId };
  const i = key.indexOf('||');
  const unitId = key.slice(0, i);
  const en = key.slice(i + 2);
  const unit = state.units.find(function(u){ return u.id === unitId; });
  if (unit){
    const item = unit.words.find(function(x){ return makeKey(unit.id, x.en) === key; });
    if (item) return { en: item.en, zh: item.zh, alt: item.alt || [], unitId: unitId };
  }
  return { en: en, zh: '', alt: [], unitId: unitId };
}

/** 错误权重：写错 2 分，不确定 1 分 */
function errScore(p){
  return (p.wrong || 0) * 2 + (p.unsure || 0);
}

/**
 * 三档判定：
 *   right  -> 箱位 +1（重来的这次只保底到 1）
 *   unsure -> 箱位压回 1，明天再来，不计“写错”
 *   wrong  -> 箱位归零，错误次数 +1，今天还会再来一次
 */
function applyAnswer(state, key, kind, isRetry, today){
  let p = state.progress[key];
  if (!p){
    const wd = resolveWord(state, key);
    p = state.progress[key] = {
      unitId: wd.unitId, en: wd.en, zh: wd.zh, alt: wd.alt || [],
      box: 0, streak: 0, wrong: 0, unsure: 0, right: 0,
      firstDate: today, lastDate: today, dueDate: today
    };
  }
  if (kind === 'right'){
    p.right++;
    if (isRetry) p.box = Math.max(p.box, 1);
    else { p.streak++; p.box = Math.min(p.box + 1, BOX_DAYS.length); }
  } else if (kind === 'unsure'){
    p.unsure++;
    p.streak = 0;
    p.box = 1;
  } else {
    p.wrong++;
    p.streak = 0;
    p.box = 0;
  }
  p.lastDate = today;
  p.dueDate = boxDue(p.box, today);
  return p;
}

function dueKeys(state, today){
  const out = [];
  const keys = Object.keys(state.progress);
  for (let i = 0; i < keys.length; i++){
    const p = state.progress[keys[i]];
    if (p.box >= state.settings.graduateBox) continue;
    if (p.dueDate > today) continue;
    out.push(keys[i]);
  }
  out.sort(function(a, b){
    const pa = state.progress[a], pb = state.progress[b];
    const sa = errScore(pa), sb = errScore(pb);
    if (sb !== sa) return sb - sa;
    if (pa.box !== pb.box) return pa.box - pb.box;
    return pa.dueDate < pb.dueDate ? -1 : 1;
  });
  return out;
}

function buildDaily(state, today){
  const s = state.settings;
  const newKeys = [];
  const seen = {};
  if (state.stats.lastNewDate !== today){
    for (let i = 0; i < Math.max(0, s.dailyUnits); i++){
      const unit = state.units[state.cursor + i];
      if (!unit) break;
      for (let j = 0; j < unit.words.length; j++){
        const k = makeKey(unit.id, unit.words[j].en);
        if (!state.progress[k] && !seen[k]){ seen[k] = 1; newKeys.push(k); }
      }
    }
  }
  const allDue = dueKeys(state, today);
  const review = allDue.slice(0, Math.max(0, s.reviewCap));

  let items;
  if (s.order === 'review-first') items = review.concat(newKeys);
  else if (s.order === 'mix') items = interleave(newKeys, review);
  else items = newKeys.concat(review);

  return {
    items: items,
    meta: { newCount: newKeys.length, reviewCount: review.length, dueTotal: allDue.length, unitIndex: state.cursor }
  };
}

function interleave(a, b){
  const out = [];
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++){
    if (i < a.length) out.push(a[i]);
    if (i < b.length) out.push(b[i]);
  }
  return out;
}

function buildErrors(state){
  const keys = Object.keys(state.progress).filter(function(k){
    const p = state.progress[k];
    return errScore(p) > 0 && p.box < state.settings.graduateBox;
  });
  keys.sort(function(a, b){
    const sa = errScore(state.progress[a]), sb = errScore(state.progress[b]);
    if (sb !== sa) return sb - sa;
    return state.progress[a].box - state.progress[b].box;
  });
  const items = keys.slice(0, 60);
  return { items: items, meta: { newCount: 0, reviewCount: items.length, dueTotal: keys.length, unitIndex: state.cursor } };
}

function buildExtra(state){
  const keys = Object.keys(state.progress).filter(function(k){
    return state.progress[k].box < state.settings.graduateBox;
  });
  keys.sort(function(a, b){
    const pa = state.progress[a], pb = state.progress[b];
    const sa = errScore(pa), sb = errScore(pb);
    if (sb !== sa) return sb - sa;
    return pa.box - pb.box;
  });
  const items = keys.slice(0, Math.max(5, state.settings.reviewCap));
  return { items: items, meta: { newCount: 0, reviewCount: items.length, dueTotal: keys.length, unitIndex: state.cursor } };
}

function buildUnit(state, unitId){
  const unit = state.units.find(function(u){ return u.id === unitId; });
  if (!unit) return { items: [], meta: { newCount: 0, reviewCount: 0, dueTotal: 0 } };
  return {
    items: unit.words.map(function(x){ return makeKey(unit.id, x.en); }),
    meta: { newCount: unit.words.length, reviewCount: 0, dueTotal: 0, unitId: unitId }
  };
}

/** 自选一课或多课：把这些单元的全部单词排成一轮 */
function buildUnits(state, ids){
  const items = [];
  (ids || []).forEach(function(id){
    const u = state.units.find(function(x){ return x.id === id; });
    if (!u) return;
    u.words.forEach(function(x){ items.push(makeKey(u.id, x.en)); });
  });
  return {
    items: items,
    meta: { newCount: items.length, reviewCount: 0, dueTotal: items.length, units: (ids || []).slice() }
  };
}

function advanceCursor(state){
  let moved = 0;
  while (state.cursor < state.units.length){
    const u = state.units[state.cursor];
    const done = u.words.length === 0 || u.words.every(function(x){
      return !!state.progress[makeKey(u.id, x.en)];
    });
    if (!done) break;
    state.cursor++;
    moved++;
  }
  return moved;
}

function streakDays(state, today){
  const days = (state.stats && state.stats.days ? state.stats.days : []).slice().sort();
  if (!days.length) return 0;
  const last = days[days.length - 1];
  if (last !== today && last !== addDays(today, -1)) return 0;
  let n = 1;
  for (let i = days.length - 2; i >= 0; i--){
    if (days[i] === addDays(days[i + 1], -1)) n++;
    else break;
  }
  return n;
}

function statsOf(state){
  const ps = Object.keys(state.progress).map(function(k){ return state.progress[k]; });
  const mastered = ps.filter(function(p){ return p.box >= state.settings.graduateBox; }).length;
  const errors = ps.filter(function(p){ return errScore(p) > 0 && p.box < state.settings.graduateBox; }).length;
  const total = state.units.reduce(function(n, u){ return n + u.words.length; }, 0);
  return { learned: ps.length, mastered: mastered, errors: errors, total: total };
}

/* ---------- 词表解析：尽量宽松，认不出就报出是哪一行 ---------- */
const CJK_RE = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;
const LATIN_RE = /[A-Za-z\u00c0-\u024f\u0100-\u017f]/;
const SEP_RE = /[,，、\t;；:：=＝|｜\/]+/;

/** 一行里同时有英文和中文却没写分隔符时，按中英文交界切开 */
function splitByCJK(line){
  const t = String(line).trim();
  if (!t) return null;
  const i = t.search(CJK_RE);
  if (i > 0){
    const latin = t.slice(0, i).trim(), cjk = t.slice(i).trim();
    if (LATIN_RE.test(latin) && CJK_RE.test(cjk)) return { latin: latin, cjk: cjk };
    return null;
  }
  if (i === 0){
    const m = t.match(/^[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]+/);
    const cjk = m ? m[0] : '';
    const latin = t.slice(cjk.length).trim();
    if (latin && LATIN_RE.test(latin)) return { latin: latin, cjk: cjk };
  }
  return null;
}

/** 解析一行：英文,中文 或 英文 中文 或 英文：中文 都行；中文在前也认 */
function parseLineEn(line){
  const t = String(line).trim();
  if (!t) return null;

  // 有制表符/竖线时以它为准：中文释义里可能带逗号（如“正餐,晚餐”），不能被当成分隔符
  if (/[\t｜|]/.test(t)){
    const tabParts = t.split(/[\t｜|]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
    if (tabParts.length >= 2){
      const alt = tabParts.slice(2).join('/').split('/').map(function(s){ return s.trim(); }).filter(Boolean);
      return { en: tabParts[0], zh: tabParts[1], alt: alt };
    }
  }

  const parts = t.split(SEP_RE).map(function(s){ return s.trim(); }).filter(function(s){ return s !== ''; });
  if (parts.length >= 2){
    let zi = -1;
    for (let i = 0; i < parts.length; i++){
      if (CJK_RE.test(parts[i])){ zi = i; break; }
    }
    if (zi === -1) zi = 1;
    const zh = parts[zi];
    const rest = parts.filter(function(_, i){ return i !== zi; });
    if (!rest.length || !zh) return null;
    return { en: rest[0], zh: zh, alt: rest.slice(1) };
  }

  const p = splitByCJK(t);
  if (p && p.latin && p.cjk) return { en: p.latin, zh: p.cjk, alt: [] };
  return null;
}

function parseWordsDetailed(text){
  const words = [], bad = [];
  String(text || '').split(/\r?\n/).forEach(function(line, idx){
    const l = line.trim();
    if (!l || l.startsWith('//')) return;
    const w = parseLineEn(l);
    if (!w){ bad.push({ line: idx + 1, text: l }); return; }
    words.push(w);
  });
  return { words: words, bad: bad };
}

function parseWords(text){
  return parseWordsDetailed(text).words;
}

function parseImport(text){
  const units = [], bad = [];
  let cur = null;
  String(text || '').split(/\r?\n/).forEach(function(line, idx){
    const l = line.trim();
    if (!l || l.startsWith('//')) return;
    if (l.startsWith('#')){
      cur = { id: uid('e'), name: l.replace(/^#+\s*/, '') || ('Unit ' + (units.length + 1)), words: [] };
      units.push(cur);
      return;
    }
    const w = parseLineEn(l);
    if (!w){ bad.push({ line: idx + 1, text: l }); return; }
    if (!cur){ cur = { id: uid('e'), name: 'Unit 1', words: [] }; units.push(cur); }
    cur.words.push(w);
  });
  return { units: units.filter(function(u){ return u.words.length > 0; }), bad: bad };
}

    version: 1,

    cursor: 0,

    stats: { days: [], lastNewDate: null },
    session: null,

  };
}

/** HTML 文件里自带的快照（“打包成新文件”时写进 head） */
function readSeed(){
  try {
    const el = document.getElementById('seed');
    if (!el) return null;
    const d = JSON.parse(el.textContent || 'null');
    return d && Array.isArray(d.units) && d.units.length ? d : null;
  } catch (e) { return null; }
}

function fromSeed(){
  const seed = readSeed();
  if (!seed) return null;
  const s = initialState();
  s.units = seed.units;
  s.settings = Object.assign({}, DEFAULT_SETTINGS, seed.settings || {});
  s.progress = seed.progress || {};
  s.stats = seed.stats || { days: [], lastNewDate: null };
  s.stats.days = Array.isArray(s.stats.days) ? s.stats.days : [];
  s.cursor = Math.min((seed.cursor | 0) || 0, s.units.length);
  s.fromSeed = true;
  return s;
}

let state = load();
if (state.adopted){ delete state.adopted; save(); }

function save(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    storageOk = false;
    if (!saveWarned){
      saveWarned = true;
      toast('这台设备存不下数据，去“设置 → 打包成新文件”留一份');
    }
  }
}

function normalizeState(s){
  if (!s || !Array.isArray(s.units) || !s.units.length) return null;
  s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings || {});
  s.progress = s.progress || {};
  s.stats = s.stats || { days: [], lastNewDate: null };
  s.stats.days = Array.isArray(s.stats.days) ? s.stats.days : [];
  if (s.stats.lastNewDate === undefined) s.stats.lastNewDate = null;
  s.cursor = Math.min(Math.max(0, s.cursor | 0), s.units.length);
  s.session = s.session || null;
  return s;
}

/** 老版本存的是示例词库（e1/e2/e3 的 book/pencil 那套），没有搬过来的价值 */
function isOldSample(units){
  return Array.isArray(units) && units.length === 3 && units[0] && units[0].id === 'e1' && units[0].name === 'Unit 1 · 学校生活';
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw){
    for (let i = 0; i < LEGACY_KEYS.length; i++){
      let old = null;
      try { old = localStorage.getItem(LEGACY_KEYS[i]); } catch (e) { old = null; }
      if (!old) continue;
      try {
        const parsed = JSON.parse(old);
        const s = normalizeState(parsed);
        if (s && !isOldSample(s.units)){ s.adopted = true; return s; }
      } catch (e) {}
    }
    const seeded = fromSeed();
    return seeded || initialState();
  }
  try {
    const s = normalizeState(JSON.parse(raw));
    return s || fromSeed() || initialState();
  } catch (e) {
    return fromSeed() || initialState();
  }
}

function snapshot(){

}

/** 当前页面的运行环境（file:// / http / App 内置浏览器） */
function envLabel(){
  const p = location.protocol;
  if (p === 'file:') return '本地文件（file://）';
  if (p === 'http:' || p === 'https:') return '网页（' + location.origin + '）';
  return 'App 内置浏览器（' + location.origin + '）';
}

function envIsWeb(){
  return location.protocol === 'http:' || location.protocol === 'https:';
}

function download(name, text, type){
  try {
    const blob = new Blob([text], { type: type || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    if (!envIsWeb()) toast('如果在 App 里打不开下载，请用“复制词库文本”');
    return true;
  } catch (e) { toast('下载失败，改用“复制词库文本”'); return false; }
}

function fallbackCopy(text, done){
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    if (ok) done();
    else toast('复制失败，请长按选择文本复制');
  } catch (e) { toast('复制失败，请长按选择文本复制'); }
}

function copyText(text, okMsg){
  const done = function(){ toast(okMsg || '已复制'); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
      return;
    }
  } catch (e) {}
  fallbackCopy(text, done);
}

/** 纯文本词库：可以粘到别处，也能贴回“批量导入” */
function unitsToText(){
  const lines = [];
  state.units.forEach(function(u){
    lines.push('# ' + u.name);
    u.words.forEach(function(x){
      lines.push([x.en, x.zh].concat(x.alt && x.alt.length ? [x.alt.join('/')] : []).join('\t'));
    });
  });
  return lines.join('\n');
}

function copyUnits(){

}

/** 把词库、进度、设置写进一个新的 HTML 文件 —— 数据跟着文件走，不依赖浏览器存储 */
function exportSelfContained(){
  try {

    let seedEl = clone.querySelector('#seed');
    if (!seedEl){
      seedEl = document.createElement('script');

    const m = clone.querySelector('#main');

    const tt = clone.querySelector('#toast');

    download('英语默写-' + dateKey() + '.html', '<!DOCTYPE html>\n' + clone.outerHTML, 'text/html');
    toast('已打包成新文件（含词库和进度）');
  } catch (e) { toast('打包失败：' + e.message); }
}

  if (!st.learned){
    html += '<section class="card tight"><p class="small muted" style="margin:0">' +
      '记录只存在这台设备的浏览器里。换设备或清缓存前，去“设置”里导出备份。</p></section>';
  }
  return html;
}

/* ---------------- 默写中 ---------------- */
function viewSession(){
  const s = state.session;
  if (!s) return viewIdle();
  if (s.phase === 'dictate') return viewDictate();
  return viewGrade();
}

/* 听写阶段：中文意思连读 N 遍 → 留出书写时间 → 自动下一个 */
function viewDictate(){
  const s = state.session;
  const item = s.items[s.idx];
  if (!item) return viewIdle();
  const wd = resolveWord(state, item.key);
  const total = s.items.length;
  const pct = Math.round((s.idx / total) * 100);
  const times = readTimes();

  let html = '<section class="card">';
  html += '<div class="q-top"><div class="prog grow"><i style="width:' + pct + '%"></i></div>' +
          '<span class="q-count">' + (s.idx + 1) + ' / ' + total + '</span></div>';

  html += '<div class="stage">';
  if (ttsOk !== false) html += '<div class="loud">🔊</div>';
  else html += '<div class="tiny muted">这个浏览器没有语音接口，直接看中文写英文</div>';
  html += '<div class="zhBig">' + esc(wd.zh || wd.en) + '</div>';
  html += '<div class="wcount">中文读 ' + times + ' 遍</div>';
  if (state.settings.showLen) html += '<div class="wcount">共 ' + wd.en.length + ' 个字母</div>';
  html += '<div class="waittip">在纸上写英文，写不完点“再听 ' + times + ' 遍”</div>';
  html += '<div class="timerbar" style="width:100%;margin-top:4px"><i id="tb"></i></div>';
  html += '</div>';

  html += '<div class="row" style="margin-top:12px;gap:8px">';
  html += '<button class="btn grow" data-act="replay">再听 ' + times + ' 遍</button>';
  html += '<button class="btn ghost grow" data-act="next-word">下一个 →</button>';
  html += '</div>';
  html += '<div class="q-foot" style="justify-content:center">' +
    '<button class="link danger" data-act="quit">结束本轮</button></div>';
  html += '</section>';
  return html;
}

/* 批改阶段：对照英文答案，三档自评 */
function viewGrade(){
  const s = state.session;
  const item = s.items[s.idx];
  if (!item){ finishSession(); return viewIdle(); }

  const wd = resolveWord(state, item.key);
  const total = s.items.length;
  const pct = Math.round((s.idx / total) * 100);
  const revealed = item.revealed !== false;

  let html = '<section class="card">';
  html += '<div class="q-top"><div class="prog grow"><i style="width:' + pct + '%"></i></div>' +
          '<span class="q-count">' + (s.idx + 1) + ' / ' + total + '</span></div>';
  html += '<div class="qtag">' + (revealed ? '批改' : '看答案前先写') + '</div>';

  html += '<div class="stage">';
  if (!revealed){
    html += '<div class="zhBig">' + esc(wd.zh || '') + '</div>';
    html += '<button class="play btn" data-act="play" style="border-radius:999px;padding:12px 24px">🔊 再听 ' + readTimes() + ' 遍</button>';
    if (state.settings.showLen) html += '<div class="wcount">共 ' + wd.en.length + ' 个字母</div>';
    html += '<div class="waittip">在纸上写下来，写完再看答案</div>';
  } else {
    html += '<div class="enBig">' + esc(wd.en) + '</div>';
    html += '<div class="subzh">' + esc(wd.zh || '') + '</div>';
    if (wd.alt && wd.alt.length){
      html += '<div class="alts">也可以拼作：' + wd.alt.map(esc).join('、') + '</div>';
    }
    html += '<button class="btn sm ghost" data-act="speak-en" data-en="' + esc(wd.en) + '" style="margin-top:2px">🔊 听这个单词怎么读</button>';
    html += '<div class="waittip">和纸上对照一下，然后选一个</div>';
  }
  html += '</div>';

  if (!revealed){
    html += '<button class="btn primary big" data-act="reveal">看答案</button>';
    html += '<div class="q-foot">' +
      '<button class="link" data-act="skip">跳过</button>' +
      '<button class="link danger" data-act="quit">结束本轮</button>' +
      '</div>';
  } else {
    html += '<div class="judge">' +
      '<button class="j-ok" data-act="judge" data-kind="right"><span>✅</span>全对</button>' +
      '<button class="j-mid" data-act="judge" data-kind="unsure"><span>🤔</span>不确定</button>' +
      '<button class="j-bad" data-act="judge" data-kind="wrong"><span>❌</span>写错了</button>' +
      '</div>';
    html += '<div class="q-foot" style="justify-content:center">' +
      '<button class="link danger" data-act="quit">结束本轮</button>' +
      '</div>';
  }
  html += '</section>';

  if (item.retry){
    html += '<p class="small muted" style="text-align:center;margin:-6px 0 12px">刚才没写对的词，再写一遍 💪</p>';
  }
  return html;
}

function unitName(id){
  const u = state.units.find(function(x){ return x.id === id; });
  return u ? u.name : '';
}

    '<p class="small muted" style="margin:8px 0 0"><code>#</code> 开头是单元名，下面每行 <code>英文,中文</code>（中文带逗号时用 Tab）。导入会追加成新单元。</p>' +
    '<textarea id="importBox" placeholder="# Unit 4 · 天气\nrain,雨\nsnow,雪\ncloudy,多云的" style="margin-top:10px"></textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn primary sm" data-act="import-batch">导入</button></div></section>';

/* ---------------- 错词本 ---------------- */
function viewErrors(){
  const rows = Object.keys(state.progress).map(function(k){
    return Object.assign({ key: k }, state.progress[k]);
  }).filter(function(p){ return errScore(p) > 0; })
    .sort(function(a, b){ return errScore(b) - errScore(a) || a.box - b.box; });

  if (!rows.length){
    return '<section class="card"><div class="empty"><div class="big">🌱</div>' +
      '<h2>还没有错词</h2><p class="small muted">默写时点“写错了”或“不确定”的词，都会登记到这里。</p></div></section>';
  }

  let html = '<section class="card tight"><div class="row between"><h2>错词本</h2>' +
    '<span class="small muted">' + rows.length + ' 个，错得多的在前</span></div>' +
    '<div class="row" style="margin-top:10px;gap:8px">' +
    '<button class="btn primary sm grow" data-act="start-errors">强化默写</button>' +
    '<button class="btn sm grow" data-act="open-sheet">打印抄写单</button>' +
    '</div></section>';

  html += '<section class="card tight"><div class="list">';
  rows.forEach(function(p){
    const grad = p.box >= state.settings.graduateBox;
    html += '<div class="item">' +
      '<div class="grow"><div class="row" style="gap:8px"><span class="w">' + esc(p.en) + '</span>' +
        (p.wrong ? '<span class="badge bad">错 ' + p.wrong + '</span>' : '') +
        (p.unsure ? '<span class="badge mid">不确定 ' + p.unsure + '</span>' : '') +
        (grad ? '<span class="badge ok">已会</span>' : '') +
      '</div><div class="small muted">' + esc(p.zh || '') + ' · ' + esc(unitName(p.unitId)) +

      '<button class="btn sm ghost" data-act="practice-word" data-key="' + esc(p.key) + '">默</button>' +
      '</div>';

/* ---------------- 自选课次 ---------------- */
let picked = [];

function pickedWords(){
  let n = 0;
  picked.forEach(function(id){
    const u = state.units.find(function(x){ return x.id === id; });
    if (u) n += u.words.length;
  });
  return n;
}

function viewPicker(){
  const curId = (state.units[state.cursor] || {}).id;
  const n = pickedWords();

  let html = '<section class="card">';
  html += '<div class="row between"><h2>自选课次</h2>' +
    '<button class="btn primary sm" data-act="pick-start"' + (n ? '' : ' disabled') + '>' +
      (n ? '开始 ' + n + ' 词' : '开始') + '</button></div>';
  html += '<p class="small muted" style="margin:8px 0 0">想默哪几课就点哪几课，可以多选。' +
    '已选 <b>' + picked.length + '</b> 课 · <b>' + n + '</b> 个词。</p>';

  html += '<div class="grid">';
  state.units.forEach(function(u){
    const mastered = u.words.filter(function(x){
      const p = state.progress[makeKey(u.id, x.en)];
      return p && p.box >= state.settings.graduateBox;
    }).length;
    const on = picked.indexOf(u.id) >= 0;
    let flag = '';
    if (u.id === curId) flag = '<span class="flag cur">当前</span>';
    else if (mastered === u.words.length && u.words.length) flag = '<span class="flag done">已会</span>';
    html += '<button class="pick' + (on ? ' on' : '') + '" data-act="pick-unit" data-unit="' + u.id + '">' +
      flag + '<b>' + esc(u.name) + '</b><span>' + mastered + '/' + u.words.length + ' 已会</span></button>';
  });
  html += '</div>';

  html += '<button class="btn primary big" data-act="pick-start"' + (n ? '' : ' disabled') + '>' +
    (n ? '开始默写（' + picked.length + ' 课 · ' + n + ' 个词）' : '先选至少一课') + '</button>';

  html += '<div class="row" style="margin-top:10px;gap:8px">';
  html += '<button class="btn ghost sm grow" data-act="pick-all">全选</button>';
  html += '<button class="btn ghost sm grow" data-act="pick-clear"' + (picked.length ? '' : ' disabled') + '>清空</button>';
  html += '<button class="btn ghost sm grow" data-act="pick-back">返回</button>';
  html += '</div>';

  if (picked.length === 1){
    const u = state.units.find(function(x){ return x.id === picked[0]; });
    if (u && u.id !== curId){
      html += '<button class="btn sm" data-act="pick-set-cursor" style="width:100%;margin-top:8px">' +
        '把每日推进的起点设为「' + esc(u.name) + '」</button>' +
        '<p class="hintline">设了以后，以后每天按顺序从这一课往下推进（不影响今天已经练过的）。</p>';
    }
  }

  html += '<details class="help"><summary>说明</summary><ul>' +
    '<li>自选课次只练选中的词，<b>不会改变</b>每日推进的进度。</li>' +
    '<li>想让以后每天都从某一课往下走，选一课再点“设为起点”。</li>' +
    '<li>当前进度：<b>' + esc((state.units[state.cursor] || {}).name || '已全部学完') + '</b></li>' +
    '</ul></details>';
  html += '</section>';
  return html;
}

/* ---------------- 抄写单 ---------------- */
function viewSheet(){

    .filter(function(p){ return errScore(p) > 0 && p.box < state.settings.graduateBox; })

    const ub = /^en[-_]US/i.test(b.lang) ? 0 : 1;
    if (ua !== ub) return ua - ub;
    return String(a.name || '').localeCompare(String(b.name || ''));
  }).forEach(function(v){
    const acc = /^en[-_]US/i.test(v.lang) ? '美音' : (/^en[-_]GB/i.test(v.lang) ? '英音' : '其他');

    '</section>';

/* ============================================================
   朗读
   ============================================================ */
let audioUnlocked = false;
let ttsWarned = false;

/**
 * 挑一个中文语音。
 * 顺序：用户选定的 > 名字里带 Natural/Neural/Online 的（神经网络音）> 常见自然人声
 *      > 任意中文 > 任意语音。
 */
const NATURAL_NAME = /natural|neural|online|premium|enhanced|siri/i;
const NICE_NAME = /xiaoxiao|xiaoyi|yunxi|yunyang|yunjian|yunjie|tingting|ting-ting|meijia|sinji|li-mu|yu-shu|google/i;

function rankVoice(v){
  const n = (v.name || '') + ' ' + (v.voiceURI || '');
  let s = 0;
  if (NATURAL_NAME.test(n)) s += 100;
  if (NICE_NAME.test(n)) s += 50;
  if (/^zh[-_]CN/i.test(v.lang)) s += 10;
  else if (/^zh/i.test(v.lang)) s += 5;
  if (v.localService === false) s += 3;
  return s;
}

function allVoices(){
  try { return speechSynthesis.getVoices() || []; } catch (e) { return []; }
}

function pickVoice(){
  const vs = allVoices();
  if (!vs.length) return null;
  const want = state.settings.voiceName;
  if (want){
    const hit = vs.find(function(v){ return v.name === want; });
    if (hit) return hit;
  }
  const zh = vs.filter(function(v){ return /^zh/i.test(v.lang) || /chinese|中文|普通话|putonghua/i.test(v.name || ''); });
  const pool = zh.length ? zh : vs;
  let best = null, bestScore = -1;
  pool.forEach(function(v){
    const s = rankVoice(v);
    if (s > bestScore){ best = v; bestScore = s; }
  });
  return best;
}

function detectTTS(){
  if (!('speechSynthesis' in window)) { ttsOk = false; return; }
  ttsOk = true;
  let tries = 0;
  const tick = setInterval(function(){
    tries++;
    if (pickVoice() || tries >= 10) clearInterval(tick);
  }, 400);
}

/** 第一次点击时把语音引擎“解锁”：部分浏览器要求 speak() 发生在用户手势里 */
function unlockAudio(){
  if (audioUnlocked || !('speechSynthesis' in window)) return;
  audioUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    u.lang = 'zh-CN';
    speechSynthesis.speak(u);
  } catch (e) {}
}

function speak(text){
  if (!text) return;
  try {
    if (!('speechSynthesis' in window)) { toast('这个浏览器不支持朗读'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    u.volume = 1;
    const v = pickVoice();
    if (v) u.voice = v;
    u.onerror = function(ev){
      const err = ev && ev.error;
      if (err === 'canceled' || err === 'interrupted') return;
      if (!ttsWarned){
        ttsWarned = true;
        toast('朗读没出声：先调大媒体音量，或在设置里点“试听一句”');
      }
    };
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 英语单词读音（批改时听，优先标准美音 en-US） ---------- */
function enVoiceList(){
  return allVoices().filter(function(v){
    return /^en/i.test(v.lang) || /english|英语/i.test(v.name || '');
  });
}

function pickEnVoice(){
  const list = enVoiceList();
  if (!list.length) return null;

  const want = state.settings.enVoiceName;
  if (want){
    const hit = list.find(function(v){ return v.name === want; });
    if (hit) return hit;
  }

  // 只要设备上有美音，就只在美音里挑；没有才退到其他英语口音
  const us = list.filter(function(v){ return /^en[-_]US/i.test(v.lang); });
  const pool = us.length ? us : list;

  let best = null, bestScore = -1;
  pool.forEach(function(v){
    const s = rankVoice(v);
    if (s > bestScore){ best = v; bestScore = s; }
  });
  return best;
}

function speakEn(text){
  if (!text) return;
  try {
    if (!('speechSynthesis' in window)){ toast('这个浏览器不支持朗读'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickEnVoice();
    u.lang = (v && /^en[-_]GB/i.test(v.lang)) ? 'en-GB' : 'en-US';
    u.rate = 0.85;
    u.volume = 1;
    if (v) u.voice = v;
    u.onerror = function(ev){
      const err = ev && ev.error;
      if (err === 'canceled' || err === 'interrupted') return;
      if (!ttsWarned){
        ttsWarned = true;
        toast('读音没出来：可能没装英文语音包，或媒体音量太小');
      }
    };
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 朗读节奏：连读 N 遍，然后计时自动翻页 ---------- */
let seqToken = 0;
let seqTimers = [];
let seqKey = '';
let seqDeadline = 0;
let seqTotal = 0;
let wordKey = '';

function readTimes(){
  const n = state.settings.readTimes | 0;
  return Math.min(3, Math.max(1, n));
}

function later(fn, ms){
  const id = setTimeout(fn, ms);
  seqTimers.push(id);
  return id;
}

function clearSeq(){
  seqToken++;
  seqTimers.forEach(function(id){ clearTimeout(id); });
  seqTimers = [];
  seqKey = '';
  seqDeadline = 0;
}

/** 读的是中文意思，不是英文答案 */
function playWord(wd, times){
  if (ttsOk === false) return;
  const text = wd.zh || '';
  if (!text) return;
  for (let i = 0; i < times; i++){
    later(function(){ speak(text); }, 150 + i * 1500);
  }
}

function startDictateSequence(){
  const s = state.session;
  if (!s || s.phase !== 'dictate') return;
  const item = s.items[s.idx];
  if (!item) return;

  const token = ++seqToken;
  seqTimers.forEach(function(id){ clearTimeout(id); });
  seqTimers = [];

  const wd = resolveWord(state, item.key);
  const times = readTimes();
  const gap = 1500;
  const writeMs = Math.max(2, state.settings.writeSeconds | 0) * 1000;
  const total = (times - 1) * gap + 900 + writeMs;

  if (ttsOk !== false && !item.noSpeak){
    for (let i = 0; i < times; i++){
      later(function(){ if (token === seqToken) speak(wd.zh || ''); }, 150 + i * gap);
    }
  }

  seqTotal = total;
  seqDeadline = Date.now() + total;
  seqKey = s.idx + ':' + item.key;

  later(function(){
    if (token !== seqToken) return;
    advanceDictation();
  }, total);
}

function advanceDictation(){
  const s = state.session;
  if (!s || s.phase !== 'dictate') return;
  clearSeq();
  s.idx++;
  if (s.idx >= s.items.length){ enterGrading(); return; }
  save();
  render();
}

function enterGrading(){
  const s = state.session;
  s.phase = 'grade';
  s.idx = 0;
  s.items.forEach(function(it){ it.revealed = true; });
  clearSeq();
  wordKey = '';
  save();
  render();
}

function maybeSpeak(){
  if (view !== 'practice' || !state.session) return;
  const s = state.session;
  if (s.phase !== 'grade') return;
  const item = s.items[s.idx];
  if (!item) return;
  const k = s.idx + ':' + item.key + ':' + (item.revealed ? 1 : 0);
  if (k === wordKey) return;
  wordKey = k;
  if (!state.settings.autoSpeak) return;
  if (item.revealed) return;
  playWord(resolveWord(state, item.key), readTimes());
}

function animateTimer(){
  const el = document.getElementById('tb');
  if (!el || !seqTotal) return;
  const left = Math.max(0, seqDeadline - Date.now());
  el.style.width = Math.round((left / seqTotal) * 100) + '%';
  void el.offsetWidth;
  el.style.transition = 'width ' + left + 'ms linear';
  el.style.width = '0%';
}

/* ============================================================
   会话
   ============================================================ */
function startSession(mode, arg){
  const t = today();
  let q;
  if (mode === 'daily') q = buildDaily(state, t);
  else if (mode === 'errors') q = buildErrors(state);
  else if (mode === 'extra') q = buildExtra(state);
  else if (mode === 'unit') q = buildUnit(state, arg);
  else if (mode === 'units') q = buildUnits(state, arg);
  else if (mode === 'keys') q = { items: arg, meta: { newCount: 0, reviewCount: arg.length, dueTotal: arg.length } };
  else return;

  if (!q.items.length){ toast('没有要默的词'); return; }

  state.session = {
    mode: mode,
    phase: state.settings.gradingMode === 'per-word' ? 'grade' : 'dictate',
    meta: q.meta,
    items: q.items.map(function(k){ return { key: k, retry: false, revealed: false, pyShown: false }; }),
    idx: 0,
    startedAt: Date.now(),
    answers: {}
  };
  clearSeq();
  wordKey = '';
  save();
  render();
}

function curItem(){
  const s = state.session;
  return s ? s.items[s.idx] : null;
}

function revealAnswer(){
  const s = state.session;
  const item = curItem();
  if (!s || s.phase !== 'grade' || !item || item.revealed) return;
  clearSeq();
  item.revealed = true;
  save();
  render();
}

function judge(kind){
  const s = state.session;
  const item = curItem();
  if (!s || s.phase !== 'grade' || !item || !item.revealed) return;

  const isRetry = item.retry;
  applyAnswer(state, item.key, kind, isRetry, today());

  const a = s.answers[item.key] || (s.answers[item.key] = { firstTry: null, wrongs: 0, unsure: 0, tries: 0 });
  a.tries++;
  if (a.firstTry === null) a.firstTry = (kind === 'right');
  if (kind === 'wrong'){ a.wrongs++; s.items.push({ key: item.key, retry: true, revealed: true, pyShown: false }); }
  else if (kind === 'unsure'){ a.unsure++; s.items.push({ key: item.key, retry: true, revealed: true, pyShown: false }); }

  s.idx++;
  save();
  if (s.idx >= s.items.length) finishSession();
  else render();
}

function skipItem(){
  const s = state.session;
  const item = curItem();
  if (!s || s.phase !== 'grade' || !item) return;
  applyAnswer(state, item.key, 'wrong', true, today());
  const a = s.answers[item.key] || (s.answers[item.key] = { firstTry: null, wrongs: 0, unsure: 0, tries: 0 });
  a.tries++;
  if (a.firstTry === null) a.firstTry = false;
  a.wrongs++;
  s.idx++;
  save();
  if (s.idx >= s.items.length) finishSession();
  else render();
  toast('跳过了，明天还会出现');
}

function quitSession(){
  if (!state.session) return;
  clearSeq();
  wordKey = '';
  state.session = null;
  save(); render();
  toast('本轮结束，进度已保存');
}

function finishSession(){
  const s = state.session;
  if (!s) return;
  const t = today();

  if (state.stats.days.indexOf(t) === -1) state.stats.days.push(t);
  state.stats.days.sort();
  if (s.mode === 'daily' && s.meta && s.meta.newCount > 0) state.stats.lastNewDate = t;
  if (s.mode === 'daily' || s.mode === 'unit') advanceCursor(state);

  const keys = Object.keys(s.answers);
  let firstTryRight = 0;
  const wrong = [], unsure = [];
  keys.forEach(function(k){
    const a = s.answers[k];
    const p = state.progress[k] || {};
    if (a.firstTry) firstTryRight++;
    else if (a.wrongs > 0) wrong.push({ key: k, en: p.en, zh: p.zh });
    else unsure.push({ key: k, en: p.en, zh: p.zh });
  });

  state.lastSummary = {
    date: t, mode: s.mode, unique: keys.length, firstTryRight: firstTryRight,
    wrong: wrong, unsure: unsure, ms: Math.max(0, Date.now() - s.startedAt)
  };
  state.session = null;
  clearSeq();
  wordKey = '';
  save();
  render();
  if (wrong.length) toast('这轮有 ' + wrong.length + ' 个词要再练');
  else if (unsure.length) toast('有 ' + unsure.length + ' 个词还不太熟');
  else toast('全对！真棒 🎉');
}

/* ============================================================
   事件
   ============================================================ */
document.getElementById('tabs').addEventListener('click', function(e){
  const t = e.target.closest('.tab');
  if (!t) return;
  view = t.dataset.tab;
  clearSeq();
  wordKey = '';
  render();
});

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act){
    case 'start-daily': startSession('daily'); break;
    case 'start-errors': startSession('errors'); break;
    case 'start-extra': startSession('extra'); break;
    case 'start-unit': startSession('unit', (state.units[state.cursor] || state.units[0] || {}).id); break;
    case 'open-picker': picked = []; view = 'picker'; render(); break;
    case 'pick-unit': {
      const id = el.dataset.unit;
      const i = picked.indexOf(id);
      if (i >= 0) picked.splice(i, 1);
      else picked.push(id);
      render();
      break;
    }
    case 'pick-all': picked = state.units.map(function(u){ return u.id; }); render(); break;
    case 'pick-clear': picked = []; render(); break;
    case 'pick-back': picked = []; view = 'practice'; render(); break;
    case 'pick-start': {
      if (!picked.length) break;
      const ids = picked.slice();
      picked = [];
      view = 'practice';
      startSession('units', ids);
      break;
    }
    case 'pick-set-cursor': {
      const id = picked[0];
      let idx = -1;
      for (let i = 0; i < state.units.length; i++){ if (state.units[i].id === id) { idx = i; break; } }
      if (idx >= 0){
        state.cursor = idx;
        save(); render();
        toast('每日推进已设为：' + state.units[idx].name);
      }
      break;
    }
    case 'start-unit-id': startSession('unit', el.dataset.unit); break;
    case 'practice-word': startSession('keys', [el.dataset.key]); break;
    case 'redo-last': {
      const ls = state.lastSummary;
      if (!ls) break;
      const keys = (ls.wrong || []).concat(ls.unsure || []).map(function(x){ return x.key; });
      if (keys.length) startSession('keys', keys);
      break;
    }
    case 'speak-en': {
      const it = curItem();
      const word = el.dataset.en || (it ? resolveWord(state, it.key).en : '');
      if (word) speakEn(word);
      break;
    }
    case 'play': {
      const item = curItem();
      if (item && !item.revealed) playWord(resolveWord(state, item.key), readTimes());
      break;
    }
    case 'replay':
      startDictateSequence();
      break;
    case 'next-word':
      advanceDictation();
      break;
    case 'reveal': revealAnswer(); break;
    case 'judge': judge(el.dataset.kind); break;
    case 'skip': skipItem(); break;
    case 'quit': quitSession(); break;
    case 'open-sheet': view = 'sheet'; render(); break;
    case 'back-errors': view = 'errors'; render(); break;
    case 'print': window.print(); break;
    case 'add-unit': addUnit(); break;
    case 'save-unit': saveUnit(el.dataset.unit); break;
    case 'del-unit': delUnit(el.dataset.unit); break;
    case 'import-batch': importBatch(); break;
    case 'export-json': exportJson(); break;
    case 'copy-units': copyUnits(); break;
    case 'export-self': exportSelfContained(); break;
    case 'load-seed': {
      const seed = readSeed();
      if (!seed){ toast('这个文件里没有快照'); break; }
      if (!confirm('用文件里的快照覆盖当前词库和进度？')) break;
      state.units = seed.units;
      state.settings = Object.assign({}, DEFAULT_SETTINGS, seed.settings || {});
      state.progress = seed.progress || {};
      state.stats = seed.stats || { days: [], lastNewDate: null };
      state.cursor = Math.min((seed.cursor | 0) || 0, state.units.length);
      state.session = null;
      state.fromSeed = true;
      save(); render();
      toast('已载入文件里的快照');
      break;
    }
    case 'import-json': document.getElementById('fileInput').click(); break;
    case 'save-settings': saveSettings(); break;
    case 'reset-progress': resetProgress(); break;
    case 'test-speak': speak('今天默写，先听中文意思。'); break;
    case 'test-speak-en': speakEn('subject'); break;
    case 'rewind':
      if (state.cursor > 0){ state.cursor--; save(); render(); toast('已退回：' + (state.units[state.cursor] || {}).name); }
      break;
  }
});

document.addEventListener('change', function(e){

  if (e.target.id === 'set-voice'){

    state.settings.uiZoom = parseFloat(e.target.value) || 1;
    save();
    applyZoom();
    toast('字号已调整：' + e.target.options[e.target.selectedIndex].text);
  }

/* 词库编辑时实时显示“认出几个词” */
document.addEventListener('input', function(e){
  const ta = e.target && e.target.closest ? e.target.closest('textarea[data-words]') : null;
  if (!ta) return;
  const el = document.getElementById('cnt-' + ta.dataset.words);
  if (!el) return;
  const res = parseWordsDetailed(ta.value);
  if (!res.words.length && res.bad.length){
    const b = res.bad[0];
    el.textContent = '第 ' + b.line + ' 行没认出中英文：' + String(b.text).slice(0, 14);
    el.style.color = 'var(--bad)';
  } else {
    el.textContent = '已识别 ' + res.words.length + ' 个词' + (res.bad.length ? '（跳过 ' + res.bad.length + ' 行）' : '');
    el.style.color = '';
  }
});

document.addEventListener('keydown', function(e){
  const s = state.session;
  if (!s || view !== 'practice') return;
  const item = curItem();
  if (!item) return;
  if (s.phase === 'dictate'){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){
      e.preventDefault();
      advanceDictation();
    } else if (e.key === 'r' || e.key === 'R'){
      e.preventDefault();
      startDictateSequence();
    }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if (!item.revealed) revealAnswer();
  } else if (item.revealed){
    if (e.key === '1') judge('right');
    else if (e.key === '2') judge('unsure');
    else if (e.key === '3') judge('wrong');
  }
});

/* ---------------- 词库编辑 ---------------- */
function addUnit(){
  const id = uid('e');
  state.units.push({ id: id, name: 'Unit ' + (state.units.length + 1), words: [] });
  save(); render();
  toast('已新增单元，填好内容后点保存');
}

function saveUnit(id){
  const u = state.units.find(function(x){ return x.id === id; });
  if (!u) return;
  const nameEl = document.querySelector('[data-name="' + id + '"]');
  const wordsEl = document.querySelector('[data-words="' + id + '"]');
  if (nameEl) u.name = nameEl.value.trim() || u.name;
  let skipped = 0;
  if (wordsEl){
    const res = parseWordsDetailed(wordsEl.value);
    if (!res.words.length){
      const b = res.bad[0];
      toast(b ? ('第 ' + b.line + ' 行没认出中英文：' + String(b.text).slice(0, 10)) : '至少要写一行：英文 中文');
      return;
    }
    u.words = res.words;
    skipped = res.bad.length;
  }
  save(); render();
  if (skipped) toast('已保存 ' + u.words.length + ' 个词，跳过 ' + skipped + ' 行看不懂的');
  else toast('已保存「' + u.name + '」' + u.words.length + ' 个词');
}

function delUnit(id){
  const u = state.units.find(function(x){ return x.id === id; });
  if (!u) return;
  if (!confirm('删除「' + u.name + '」？这个词单元和进度都会消失。')) return;
  state.units = state.units.filter(function(x){ return x.id !== id; });
  Object.keys(state.progress).forEach(function(k){
    if (state.progress[k].unitId === id) delete state.progress[k];
  });
  state.cursor = Math.min(state.cursor, state.units.length);
  save(); render();
}

function importBatch(){
  const box = document.getElementById('importBox');
  const res = parseImport(box ? box.value : '');
  if (!res.units.length){
    const b = res.bad[0];
    toast(b ? ('第 ' + b.line + ' 行没认出中英文：' + String(b.text).slice(0, 10)) : '没解析到内容，格式：英文 中文');
    return;
  }
  res.units.forEach(function(u){ state.units.push(u); });
  save(); render();
  const n = res.units.reduce(function(s, u){ return s + u.words.length; }, 0);
  toast('已导入 ' + res.units.length + ' 个单元 / ' + n + ' 个词' + (res.bad.length ? '，跳过 ' + res.bad.length + ' 行' : ''));
}

function exportJson(){
  const data = {
    version: state.version, units: state.units, progress: state.progress,
    cursor: state.cursor, settings: state.settings, stats: state.stats
  };
  download('tingxie-en-' + today() + '.json', JSON.stringify(data, null, 2), 'application/json');
  toast('已导出备份');
}

function importJsonFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const d = JSON.parse(reader.result);
      if (!d.units || !Array.isArray(d.units)) throw new Error('bad');
      if (!confirm('恢复备份会覆盖当前词库与进度，继续？')) return;
      state.units = d.units;
      state.progress = d.progress || {};
      state.cursor = Math.min(d.cursor | 0, state.units.length);
      state.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
      state.stats = d.stats || { days: [], lastNewDate: null };
      state.session = null;
      clearSeq();
      wordKey = '';
      save(); render();
      toast('已恢复备份');
    } catch (err){ toast('文件格式不对'); }
  };
  reader.readAsText(file);
}

function saveSettings(){
  const num = function(id, def, min, max){
    const el = document.getElementById(id);
    const v = parseInt(el && el.value, 10);
    if (isNaN(v)) return def;
    return Math.min(Math.max(v, min), max);
  };
  state.settings.dailyUnits = num('set-units', 1, 0, 5);
  state.settings.reviewCap = num('set-cap', 30, 5, 200);
  state.settings.graduateBox = num('set-grad', 6, 2, 10);
  state.settings.readTimes = num('set-read', 3, 1, 3);
  state.settings.writeSeconds = num('set-write', 8, 2, 20);
  const ord = document.getElementById('set-order');
  if (ord) state.settings.order = ord.value;
  const gm = document.getElementById('set-mode');
  if (gm) state.settings.gradingMode = gm.value;
  state.settings.autoSpeak = !!document.getElementById('set-speak').checked;
  state.settings.showLen = !!document.getElementById('set-len').checked;
  clearSeq();
  wordKey = '';
  save(); render();
  toast('设置已保存');
}

function resetProgress(){
  if (!confirm('清空全部学习记录（词库保留）？')) return;
  state.progress = {};
  state.cursor = 0;
  state.stats = { days: [], lastNewDate: null };
  state.session = null;
  state.lastSummary = null;
  save(); render();
  toast('已清空，从第 1 单元重新开始');
}


/* 屏幕缩放：独立应用里 Edge 的网页字体设置不生效，用 CSS zoom 兜底 */
function applyZoom(){
  try { const z = state.settings && state.settings.uiZoom > 0 ? state.settings.uiZoom : 1; document.documentElement.style.zoom = z; } catch (e) {}
}

/* ---------------- 启动 ---------------- */
detectTTS();
applyZoom();
render();

/* 第一次点击（任意位置）顺手解锁语音引擎，安卓上这一步很关键 */
document.addEventListener('click', unlockAudio, { capture: true, once: true });

/* 语音列表是异步加载的，加载完如果正停在设置页就刷新下拉 */
if ('speechSynthesis' in window && typeof speechSynthesis.addEventListener === 'function'){
  speechSynthesis.addEventListener('voiceschanged', function(){
    if (view === 'settings') render();
  });
}

/* 用网址打开时注册离线缓存：断网也能用，且“添加到主屏幕”是独立应用 */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<style>
#pwaInstallBtn{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:9999;
  background:#c0533f;color:#fff;border:0;border-radius:999px;padding:12px 20px;font:inherit;
  font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(192,83,63,.4);cursor:pointer;
  display:flex;align-items:center;gap:6px;letter-spacing:.02em}
#pwaInstallBtn:active{transform:scale(.96)}
#pwaInstallBtn[hidden]{display:none}
</style>
<button id="pwaInstallBtn" hidden>📲 安装到桌面</button>
<script>
/* PWA 安装按钮：浏览器觉得这个页面“可安装”时，beforeinstallprompt 会触发，按钮才出现；
   点按钮 = 系统原生安装弹窗。Edge/Chrome 都走这个通道，比翻菜单找“安装应用”更靠谱 */
(function(){
  var btn = document.getElementById('pwaInstallBtn');
  if (!btn) return;
  if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return; /* 已是全屏应用 */
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener('click', function(){
    if (!deferred) { btn.hidden = true; return; }
    deferred.prompt();
    Promise.resolve(deferred.userChoice).then(function(){
      deferred = null;
      btn.hidden = true;
    }).catch(function(){ deferred = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function(){ btn.hidden = true; });
})();
</script>
